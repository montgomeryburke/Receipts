<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0e7c66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Receipt Keeper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --brand: #0e7c66;
    --brand-dark: #0a5c4c;
    --bg: #f4f6f5;
    --card: #ffffff;
    --text: #1c2321;
    --muted: #6b7773;
    --danger: #b3402a;
    --line: #e3e8e6;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, Roboto, "Segoe UI", sans-serif; }
  body { padding-bottom: 40px; }
  header {
    background: var(--brand); color: #fff; padding: 14px 16px;
    padding-top: calc(14px + env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 19px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .yearwrap { display: flex; align-items: center; gap: 6px; }
  .yearwrap label { font-size: 12px; opacity: .85; }
  select#year {
    background: var(--brand-dark); color: #fff; border: none; border-radius: 8px;
    font-size: 15px; padding: 7px 10px; font-weight: 600;
  }
  main { padding: 16px; max-width: 560px; margin: 0 auto; }
  .card {
    background: var(--card); border-radius: 14px; padding: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 14px;
  }
  button {
    font-family: inherit; border: none; border-radius: 12px; cursor: pointer;
    font-size: 16px; font-weight: 600;
  }
  .btn-big {
    width: 100%; padding: 18px; background: var(--brand); color: #fff; font-size: 18px;
  }
  .btn-big:active { background: var(--brand-dark); }
  .btn-secondary { background: #e8eeec; color: var(--text); padding: 12px 16px; }
  .btn-danger { background: #f6e5e0; color: var(--danger); padding: 12px 16px; }
  .btn-row { display: flex; gap: 10px; margin-top: 14px; }
  .btn-row button { flex: 1; }
  .hint { color: var(--muted); font-size: 12.5px; margin-top: 10px; line-height: 1.45; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .6px;
       color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  #photoPreview { width: 100%; border-radius: 10px; max-height: 260px; object-fit: contain;
                  background: #222; }
  .progresswrap { margin: 12px 0 4px; }
  .progressbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progressbar > div { height: 100%; width: 0%; background: var(--brand); transition: width .2s; }
  .progresslabel { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .field { margin-top: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .field input {
    width: 100%; font-size: 17px; padding: 12px; border: 1.5px solid var(--line);
    border-radius: 10px; font-family: inherit; background: #fff; color: var(--text);
  }
  .field input:focus { outline: none; border-color: var(--brand); }
  .amount-row { display: flex; gap: 10px; }
  .amount-row .field { flex: 1; }
  .detected { font-size: 12px; color: var(--brand); margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px;
       padding: 6px 4px; border-bottom: 1px solid var(--line); }
  td { padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.amt, th.amt { text-align: right; white-space: nowrap; }
  .summary { display: flex; justify-content: space-between; align-items: baseline;
             margin-bottom: 10px; }
  .summary .total { font-size: 22px; font-weight: 700; color: var(--brand); }
  .summary .count { font-size: 13px; color: var(--muted); }
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #24312d; color: #fff; padding: 12px 20px; border-radius: 10px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .25s;
    max-width: 86%; text-align: center; z-index: 50;
  }
  #toast.show { opacity: 1; }
  .hidden { display: none !important; }
  .spinner {
    width: 22px; height: 22px; border: 3px solid var(--line);
    border-top-color: var(--brand); border-radius: 50%; margin: 0 auto;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 14px 0; }
  .photogrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photogrid img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover;
                   border-radius: 8px; background: #e3e8e6; cursor: pointer; }
  #photoOverlay { position: fixed; inset: 0; background: rgba(10,14,13,.94); z-index: 60;
                  display: flex; align-items: center; justify-content: center; }
  #photoOverlay img { max-width: 96%; max-height: 88%; border-radius: 6px; }
  #photoOverlay .closex { position: absolute; right: 16px; color: #fff; font-size: 26px;
                          top: calc(12px + env(safe-area-inset-top));
                          background: none; padding: 8px; }
  .webonly { }
</style>
</head>
<body>
<header>
  <h1>Receipt Keeper</h1>
  <div class="yearwrap">
    <label for="year">Tax year</label>
    <select id="year"></select>
  </div>
</header>

<main>
  <!-- HOME VIEW -->
  <div id="viewHome">
    <div class="card">
      <button class="btn-big" id="btnScan">&#128247;&nbsp; Scan a receipt</button>
      <div class="btn-row hidden" id="reconnectRow">
        <button class="btn-secondary" id="btnReconnect">Reconnect your receipts folder</button>
      </div>
      <div class="hint" id="storageHint"></div>
      <div class="btn-row hidden" id="folderRow">
        <button class="btn-secondary" id="btnChooseDir">Choose folder&hellip;</button>
        <button class="btn-secondary hidden" id="btnForgetDir">Use private storage</button>
      </div>
    </div>

    <div class="card">
      <div class="summary">
        <span class="count" id="sumCount"></span>
        <span class="total" id="sumTotal"></span>
      </div>
      <div id="entriesWrap"></div>
      <div class="webonly hidden" id="webExportRow">
        <div class="btn-row">
          <button class="btn-secondary" id="btnOpenSheet">&#128202; Open spreadsheet</button>
          <button class="btn-secondary" id="btnPhotos">&#128247; View photos</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PHOTOS VIEW -->
  <div id="viewPhotos" class="hidden">
    <div class="card">
      <div class="btn-row" style="margin:0 0 12px">
        <button class="btn-secondary" id="btnPhotosBack" style="flex:0 0 auto">&#8592; Back</button>
      </div>
      <h2 id="photosTitle">Receipt photos</h2>
      <div id="photoGrid" class="photogrid"></div>
      <div class="hint" id="photosHint"></div>
    </div>
  </div>

  <!-- REVIEW VIEW -->
  <div id="viewReview" class="hidden">
    <div class="card">
      <h2>Receipt photo</h2>
      <img id="photoPreview" alt="receipt photo">
      <div class="progresswrap" id="ocrProgress">
        <div class="progressbar"><div id="ocrBar"></div></div>
        <div class="progresslabel" id="ocrLabel">Reading receipt&hellip;</div>
      </div>
    </div>
    <div class="card" id="reviewForm">
      <h2>Confirm details</h2>
      <div class="field">
        <label for="fDate">Date</label>
        <input type="date" id="fDate">
      </div>
      <div class="amount-row">
        <div class="field">
          <label for="fAmountEx">Amount (excl. tax)</label>
          <input type="number" id="fAmountEx" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
        </div>
        <div class="field">
          <label for="fGst">Tax (GST)</label>
          <input type="number" id="fGst" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
        </div>
        <div class="field">
          <label for="fTotal">Total (incl. tax)</label>
          <input type="number" id="fTotal" inputmode="decimal" step="0.01" min="0" placeholder="0.00">
        </div>
      </div>
      <div class="hint" style="margin-top:6px">Fill in any of the three amounts — if you
        enter two, the third is worked out for you.</div>
      <div class="detected" id="detectedNote"></div>
      <div class="field">
        <label for="fDesc">What was it for?</label>
        <input type="text" id="fDesc" placeholder="e.g. office supplies" autocomplete="off">
      </div>
      <div class="btn-row">
        <button class="btn-danger" id="btnDiscard">Discard</button>
        <button class="btn-big" id="btnSave" style="flex:2">Save receipt</button>
      </div>
    </div>
  </div>
</main>

<div id="toast"></div>
<input type="file" accept="image/*" capture="environment" id="webCamInput" class="hidden">

<script src="xlsx.full.min.js"></script>
<script src="tesseract.min.js"></script>
<script>
'use strict';

/* ================= Environment ================= */
var IS_ANDROID = typeof window.AndroidBridge !== 'undefined';
var VENDOR = new URL('./', location.href).href;

var HEADERS = ['Date', 'Comments', 'Amount (excl. tax)', 'Tax (GST)',
               'Total (incl. tax)', 'Receipt photo'];
var COL_DATE = 0, COL_DESC = 1, COL_EX = 2, COL_TAX = 3, COL_TOTAL = 4, COL_PHOTO = 5;
var SHEET_NAME = 'Receipts';

var state = {
  year: String(new Date().getFullYear()),
  photoUrl: null,      // URL for preview + OCR
  photoName: null,     // file name recorded in the spreadsheet
  photoId: null,       // Android MediaStore id (for discard)
  photoBlob: null,     // web mode: blob to persist on save
  worker: null,
  workerReady: false,
  busy: false
};

/* ================= Small helpers ================= */
function $(id) { return document.getElementById(id); }

function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

function b64ToU8(b64) {
  var bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
function u8ToB64(u8) {
  var s = '', chunk = 0x8000;
  for (var i = 0; i < u8.length; i += chunk) {
    s += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
  }
  return btoa(s);
}
function money(n) {
  return '$' + (Math.round(n * 100) / 100).toFixed(2);
}
function todayISO() {
  var d = new Date();
  var m = ('0' + (d.getMonth() + 1)).slice(-2), day = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '-' + m + '-' + day;
}
function tsName() {
  var d = new Date();
  function p(x) { return ('0' + x).slice(-2); }
  return 'receipt_' + d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
         '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.jpg';
}

/* ================= Storage adapters ================= */
var opfsOk = !IS_ANDROID && !!(navigator.storage && navigator.storage.getDirectory);
var dirSupport = !IS_ANDROID && ('showDirectoryPicker' in window);
var chosenDir = null;        // FileSystemDirectoryHandle the user picked
var pendingDirHandle = null; // saved handle waiting for permission re-grant

/* --- tiny IndexedDB key-value store (persists the folder handle) --- */
function idbOpen() {
  return new Promise(function (res, rej) {
    var r = indexedDB.open('rk-db', 1);
    r.onupgradeneeded = function () { r.result.createObjectStore('kv'); };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { rej(r.error); };
  });
}
function idbSet(key, val) {
  return idbOpen().then(function (db) {
    return new Promise(function (res, rej) {
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(val, key);
      tx.oncomplete = res; tx.onerror = function () { rej(tx.error); };
    });
  });
}
function idbGet(key) {
  return idbOpen().then(function (db) {
    return new Promise(function (res) {
      var r = db.transaction('kv').objectStore('kv').get(key);
      r.onsuccess = function () { res(r.result || null); };
      r.onerror = function () { res(null); };
    });
  }).catch(function () { return null; });
}
function idbDel(key) {
  return idbOpen().then(function (db) {
    return new Promise(function (res) {
      var tx = db.transaction('kv', 'readwrite');
      tx.objectStore('kv').delete(key);
      tx.oncomplete = res; tx.onerror = res;
    });
  }).catch(function () {});
}

function hasFileStorage() { return !!chosenDir || opfsOk; }

/* Directory to VIEW files for a year. The chosen folder is authoritative:
   when one is set, only it is read — the app's private mirror is just a
   backup, so photos you deleted from your folder stay deleted. The mirror
   is only shown when no folder has been chosen at all. */
function yearSourceDir(year) {
  if (chosenDir) return chosenDir.getDirectoryHandle(year);
  return opfsDir(year, false);
}

function opfsReadFile(year, name) {
  return opfsDir(year, false)
    .then(function (dir) { return dir.getFileHandle(name); })
    .then(function (fh) { return fh.getFile(); })
    .then(function (f) { return f.arrayBuffer(); })
    .then(function (ab) { return new Uint8Array(ab); });
}
function opfsWriteFile(year, name, data) {
  return opfsDir(year, true)
    .then(function (dir) { return dir.getFileHandle(name, { create: true }); })
    .then(function (fh) { return fh.createWritable(); })
    .then(function (w) { return w.write(data).then(function () { return w.close(); }); });
}
function folderWriteFile(year, name, data) {
  return chosenDir.getDirectoryHandle(year, { create: true })
    .then(function (dir) { return dir.getFileHandle(name, { create: true }); })
    .then(function (fh) { return fh.createWritable(); })
    .then(function (w) { return w.write(data).then(function () { return w.close(); }); });
}

/* Files written to the mirror while the folder was unreachable are queued and
   copied over automatically the next time the folder is accessible. */
function addPendingSync(year, name) {
  return idbGet('pending:' + year).then(function (list) {
    list = list || [];
    if (list.indexOf(name) < 0) list.push(name);
    return idbSet('pending:' + year, list);
  }).catch(function () {});
}
function flushPendingSync(year) {
  if (!chosenDir) return Promise.resolve();
  return idbGet('pending:' + year).then(function (list) {
    if (!list || !list.length) return;
    var remaining = list.slice();
    var chain = Promise.resolve();
    list.forEach(function (name) {
      chain = chain.then(function () {
        return opfsReadFile(year, name)
          .then(function (u8) { return folderWriteFile(year, name, u8); })
          .then(function () {
            remaining = remaining.filter(function (n) { return n !== name; });
          })
          .catch(function () {});
      });
    });
    return chain.then(function () { return idbSet('pending:' + year, remaining); });
  }).catch(function () {});
}

/* Save a file to the app mirror (always works, no prompts) AND to the chosen
   folder when accessible; queue it for later sync otherwise. */
function saveFileEverywhere(year, name, data) {
  var mirror = opfsOk
    ? opfsWriteFile(year, name, data).catch(function () {})
    : Promise.resolve();
  return mirror.then(function () {
    if (chosenDir) {
      return folderWriteFile(year, name, data)
        .then(function () { return flushPendingSync(year); })
        .catch(function () { return addPendingSync(year, name); });
    }
    if (pendingDirHandle) return addPendingSync(year, name);
  });
}

function opfsDir(year, create) {
  return navigator.storage.getDirectory().then(function (root) {
    return root.getDirectoryHandle('Receipts', { create: !!create });
  }).then(function (r) {
    return r.getDirectoryHandle(year, { create: !!create });
  });
}

function xlsxName(year) { return 'Receipts-' + year + '.xlsx'; }

/* Read the spreadsheet from the user's chosen folder only (null if not
   accessible right now — never prompts). */
function readFolderXlsx(year) {
  if (!chosenDir) return Promise.resolve(null);
  return chosenDir.getDirectoryHandle(year)
    .then(function (d) { return d.getFileHandle(xlsxName(year)); })
    .then(function (fh) { return fh.getFile(); })
    .then(function (f) { return f.arrayBuffer(); })
    .then(function (ab) { return new Uint8Array(ab); })
    .catch(function () { return null; });
}
function readMirrorXlsx(year) {
  if (!opfsOk) return Promise.resolve(null);
  return opfsReadFile(year, xlsxName(year)).catch(function () { return null; });
}

/* The spreadsheet file is the single source of truth. When a folder is
   chosen it is authoritative — the app's private mirror is only a backup
   copy and is never read while the folder is accessible, so deleting the
   file from your folder really does start the year fresh. */
function readXlsx(year) {
  if (IS_ANDROID) {
    var b64 = AndroidBridge.readSpreadsheet(year);
    return Promise.resolve(b64 ? b64ToU8(b64) : null);
  }
  if (chosenDir) return readFolderXlsx(year);
  return readMirrorXlsx(year).then(function (m) {
    return m || (state._memXlsx && state._memXlsx[year]) || null;
  });
}

function writeXlsx(year, u8) {
  if (IS_ANDROID) {
    var res = AndroidBridge.writeSpreadsheet(year, u8ToB64(u8));
    return res === 'ok' ? Promise.resolve() : Promise.reject(new Error(res));
  }
  if (!hasFileStorage()) {
    state._memXlsx = state._memXlsx || {};
    state._memXlsx[year] = u8;
    return Promise.resolve();
  }
  return saveFileEverywhere(year, xlsxName(year), u8);
}

function savePhotoWeb(year, blob, name) {
  if (!hasFileStorage()) return Promise.resolve(false);
  return saveFileEverywhere(year, name, blob).then(function () { return true; });
}

function deleteCapturedPhoto() {
  if (IS_ANDROID && state.photoId) {
    try { AndroidBridge.deletePhoto(String(state.photoId)); } catch (e) {}
  }
}

/* ================= Spreadsheet logic =================
   The Excel file IS the record. On every refresh the app reads it and shows
   exactly what it contains; if there is no file yet (first run, or you
   deleted it to start fresh) a new empty one is created. */

function parseRows(u8) {
  try {
    var wb = XLSX.read(u8, { type: 'array' });
    var ws = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(ws, { header: 1 });
    var header = null;
    if (rows.length && String(rows[0][0]).toLowerCase() === 'date') header = rows.shift();
    rows = rows.filter(function (r) {
      return r && r.length && String(r[0]).toLowerCase() !== 'totals';
    });
    // Normalise dates the user reformatted in Excel (serial numbers → text).
    rows.forEach(function (r) {
      if (typeof r[0] === 'number') {
        try { r[0] = XLSX.SSF.format('yyyy-mm-dd', r[0]); } catch (e) {}
      }
    });
    // Files from the old layout (Date, Description, Amount incl. GST, GST,
    // photo) are lifted into the current columns.
    if (header && /incl/i.test(String(header[2] || ''))) {
      rows = rows.map(function (r) {
        return [r[0], r[1], '', r[3] == null ? '' : r[3],
                r[2] == null ? '' : r[2], r[4] == null ? '' : r[4]];
      });
    }
    return rows;
  } catch (e) {
    return null;
  }
}

function sortRows(rows) {
  rows.sort(function (a, b) {
    var d = String(a[COL_DATE]).localeCompare(String(b[COL_DATE]));
    if (d !== 0) return d;
    return String(a[COL_PHOTO] || '').localeCompare(String(b[COL_PHOTO] || ''));
  });
  return rows;
}

function loadRows(year) {
  return readXlsx(year).then(function (u8) {
    var rows = u8 ? parseRows(u8) : null;
    if (rows) return rows;
    // No spreadsheet yet (or it can't be read) → start the year fresh.
    return writeXlsx(year, buildXlsx([]))
      .catch(function () {})
      .then(function () { return []; });
  });
}

function buildXlsx(rows) {
  var data = [HEADERS].concat(rows);
  var ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = [{ wch: 11 }, { wch: 28 }, { wch: 15 }, { wch: 12 }, { wch: 15 }, { wch: 30 }];

  // Totals row: label + live SUM formulas so it stays right when the file
  // is edited in Excel. (A cached value is stored for readers that don't
  // calculate formulas.)
  var lastData = Math.max(rows.length + 1, 2);
  var totalRow = rows.length + 2;
  ws['A' + totalRow] = { t: 's', v: 'Totals' };
  ['C', 'D', 'E'].forEach(function (col, i) {
    var idx = [COL_EX, COL_TAX, COL_TOTAL][i], sum = 0;
    rows.forEach(function (r) {
      var v = parseFloat(r[idx]);
      if (isFinite(v)) sum += v;
    });
    ws[col + totalRow] = {
      t: 'n', v: Math.round(sum * 100) / 100,
      f: 'SUM(' + col + '2:' + col + lastData + ')'
    };
  });
  var range = XLSX.utils.decode_range(ws['!ref']);
  range.e.r = totalRow - 1;
  range.e.c = Math.max(range.e.c, HEADERS.length - 1);
  ws['!ref'] = XLSX.utils.encode_range(range);

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, SHEET_NAME);
  return new Uint8Array(XLSX.write(wb, { type: 'array', bookType: 'xlsx' }));
}

function appendRow(year, row) {
  // Read the file first so the new row lands on top of whatever it holds now.
  return loadRows(year).then(function (rows) {
    rows.push(row);
    sortRows(rows);
    return writeXlsx(year, buildXlsx(rows));
  });
}

/* ================= OCR ================= */
function getWorker(onProgress) {
  if (state.worker && state.workerReady) return Promise.resolve(state.worker);
  return Tesseract.createWorker('eng', 1, {
    workerPath: VENDOR + 'worker.min.js',
    corePath: VENDOR,
    langPath: VENDOR.replace(/\/$/, ''),
    workerBlobURL: false,
    logger: function (m) {
      if (onProgress) onProgress(m);
    }
  }).then(function (w) {
    state.worker = w;
    state.workerReady = true;
    return w;
  });
}

function preprocess(img) {
  var MAX = 1700;
  var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  var scale = Math.min(1, MAX / Math.max(w, h));
  var cw = Math.round(w * scale), ch = Math.round(h * scale);
  var c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  var ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, cw, ch);
  var d = ctx.getImageData(0, 0, cw, ch), px = d.data;
  for (var i = 0; i < px.length; i += 4) {
    var g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
    g = (g - 128) * 1.25 + 132;           // mild contrast boost
    g = g < 0 ? 0 : (g > 255 ? 255 : g);
    px[i] = px[i + 1] = px[i + 2] = g;
  }
  ctx.putImageData(d, 0, 0);
  return c;
}

/* Extract total + GST from OCR text */
function extractAmounts(text) {
  var lines = text.split('\n');
  var best = null, gst = null, all = [];

  function values(line) {
    var out = [], re = /(\d{1,3}(?:,\d{3})+\.\d{2}|\d+\.\d{2})/g, m;
    while ((m = re.exec(line)) !== null) {
      var v = parseFloat(m[1].replace(/,/g, ''));
      if (isFinite(v) && v > 0 && v < 1000000) out.push(v);
    }
    return out;
  }

  for (var i = 0; i < lines.length; i++) {
    var line = lines[i], low = line.toLowerCase();
    var vals = values(line);
    if (!vals.length) continue;
    var max = Math.max.apply(null, vals);
    all.push(max);

    var score = 0;
    if (/change|cash\b|tender|rounding|loyalty|points|account|approved|auth/.test(low)) {
      score = -1;
    } else if (/sub\s*-?\s*total/.test(low)) {
      score = 1;
    } else if (/grand\s*total|total\s*due|amount\s*due|balance\s*due|total\s*incl|inc\.?\s*gst/.test(low)) {
      score = 5;
    } else if (/\btotal\b/.test(low)) {
      score = 4;
    } else if (/amount|balance/.test(low)) {
      score = 2;
    }

    if (/\bgst\b|\btax\b|\bhst\b|\bvat\b/.test(low) && score < 4) {
      var gv = Math.min.apply(null, vals);
      if (gst === null || gv > gst.value) gst = { value: gv };
      continue;
    }

    if (score > 0 && (best === null || score > best.score ||
        (score === best.score && max > best.value))) {
      best = { value: max, score: score };
    }
  }

  var total = best ? best.value : (all.length ? Math.max.apply(null, all) : null);
  var gstVal = gst && total !== null && gst.value < total ? gst.value : null;
  return { total: total, gst: gstVal, confident: !!best };
}

/* ================= Views ================= */
function showHome() {
  $('viewReview').classList.add('hidden');
  $('viewPhotos').classList.add('hidden');
  $('viewHome').classList.remove('hidden');
  refreshEntries();
}

function showReview() {
  $('viewHome').classList.add('hidden');
  $('viewReview').classList.remove('hidden');
}

/* Best "what this receipt cost" figure for a row: the total incl. tax when
   present, otherwise whatever parts were entered added together. */
function rowTotal(r) {
  var t = parseFloat(r[COL_TOTAL]);
  if (isFinite(t)) return t;
  var ex = parseFloat(r[COL_EX]), tax = parseFloat(r[COL_TAX]), sum = 0, any = false;
  if (isFinite(ex)) { sum += ex; any = true; }
  if (isFinite(tax)) { sum += tax; any = true; }
  return any ? sum : null;
}

function refreshEntries() {
  loadRows(state.year).then(function (rows) {
    var total = 0;
    for (var i = 0; i < rows.length; i++) {
      var v = rowTotal(rows[i]);
      if (v !== null) total += v;
    }
    $('sumCount').textContent = rows.length === 1 ? '1 receipt in ' + state.year
      : rows.length + ' receipts in ' + state.year;
    $('sumTotal').textContent = money(total);

    var wrap = $('entriesWrap');
    if (!rows.length) {
      wrap.innerHTML = '<div class="empty">No receipts yet for ' + state.year +
        '.<br>Tap &ldquo;Scan a receipt&rdquo; to add the first one.</div>';
      return;
    }
    var html = '<table><tr><th>Date</th><th>Comments</th><th class="amt">Total</th></tr>';
    var start = Math.max(0, rows.length - 8);
    for (var j = rows.length - 1; j >= start; j--) {
      var r = rows[j];
      var amt = rowTotal(r);
      html += '<tr><td>' + esc(r[COL_DATE]) + '</td><td>' + esc(r[COL_DESC]) +
        '</td><td class="amt">' + (amt !== null ? money(amt) : '') + '</td></tr>';
    }
    html += '</table>';
    if (start > 0) {
      html += '<div class="hint">Showing latest 8 of ' + rows.length +
        ' &mdash; the full list is in the spreadsheet.</div>';
    }
    wrap.innerHTML = html;
  });
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

/* ================= Scan flow ================= */

/* Make sure we still have permission on the chosen folder. Called from user
   taps (scan/save), so the browser is allowed to show its one-tap Allow
   prompt instead of forcing the user to re-pick the folder. */
function ensureDirPermission() {
  var h = chosenDir || pendingDirHandle;
  if (!h || typeof h.queryPermission !== 'function') return Promise.resolve();
  return h.queryPermission({ mode: 'readwrite' }).then(function (p) {
    if (p === 'granted') {
      chosenDir = h; pendingDirHandle = null;
      return;
    }
    return h.requestPermission({ mode: 'readwrite' }).then(function (p2) {
      if (p2 === 'granted') {
        chosenDir = h; pendingDirHandle = null;
        flushPendingSync(state.year);
      } else {
        pendingDirHandle = h; chosenDir = null;
        toast('Folder access not allowed — saving to app storage instead');
      }
    });
  }).catch(function () {}).then(function () { refreshStorageUI(); });
}

function startScan() {
  if (state.busy) return;
  ensureDirPermission().then(function () {
    if (IS_ANDROID) {
      AndroidBridge.takePhoto(state.year);
    } else {
      $('webCamInput').value = '';
      $('webCamInput').click();
    }
  });
}

/* Android calls this after the camera returns */
window.onPhotoResult = function (ok, url, name) {
  if (!ok) { toast('No photo taken'); return; }
  var id = null;
  var m = /\/photo\/(\d+)/.exec(url);
  if (m) id = m[1];
  beginReview(url, name, id, null);
};

$('webCamInput').addEventListener('change', function () {
  var f = this.files && this.files[0];
  if (!f) return;
  var name = tsName();
  beginReview(URL.createObjectURL(f), name, null, f);
});

function beginReview(url, name, photoId, blob) {
  state.photoUrl = url;
  state.photoName = name;
  state.photoId = photoId;
  state.photoBlob = blob;
  state.busy = true;

  $('photoPreview').src = url;
  $('fDate').value = todayISO();
  $('fAmountEx').value = '';
  $('fGst').value = '';
  $('fTotal').value = '';
  $('fDesc').value = '';
  $('detectedNote').textContent = '';
  $('ocrProgress').classList.remove('hidden');
  $('ocrBar').style.width = '3%';
  $('ocrLabel').textContent = 'Starting scanner…';
  showReview();

  var img = new Image();
  img.onload = function () { runOcr(img); };
  img.onerror = function () {
    ocrDone(null, 'Could not load the photo — enter the amount manually.');
  };
  img.src = url;
}

function runOcr(img) {
  var canvas;
  try { canvas = preprocess(img); }
  catch (e) { ocrDone(null, 'Could not process the photo — enter details manually.'); return; }

  getWorker(function (m) {
    if (m && m.status === 'recognizing text') {
      $('ocrBar').style.width = Math.round(8 + m.progress * 90) + '%';
      $('ocrLabel').textContent = 'Reading receipt… ' + Math.round(m.progress * 100) + '%';
    } else if (m && m.status) {
      $('ocrLabel').textContent = 'Preparing scanner…';
    }
  }).then(function (worker) {
    $('ocrBar').style.width = '8%';
    return worker.recognize(canvas);
  }).then(function (res) {
    var text = res && res.data && res.data.text ? res.data.text : '';
    var found = extractAmounts(text);
    ocrDone(found, null);
  }).catch(function (e) {
    ocrDone(null, 'Scanning failed — enter the amount manually.');
  });
}

function ocrDone(found, errMsg) {
  state.busy = false;
  $('ocrProgress').classList.add('hidden');
  if (errMsg) {
    $('detectedNote').textContent = errMsg;
    return;
  }
  if (found && found.total !== null) {
    $('fTotal').value = found.total.toFixed(2);
    var note = found.confident
      ? 'Found total ' + money(found.total) + ' — please check it.'
      : 'Best guess: ' + money(found.total) + ' — please check it.';
    if (found.gst !== null) {
      $('fGst').value = found.gst.toFixed(2);
      $('fAmountEx').value = (found.total - found.gst).toFixed(2);
      note += ' GST ' + money(found.gst) + '.';
    }
    $('detectedNote').textContent = note;
  } else {
    $('detectedNote').textContent =
      'Couldn’t read an amount — please type it in.';
  }
  try { $('fDesc').focus(); } catch (e) {}
}

function saveCurrent() {
  function num(id) {
    var v = parseFloat($(id).value);
    return isFinite(v) && v > 0 ? Math.round(v * 100) / 100 : null;
  }
  var ex = num('fAmountEx'), tax = num('fGst'), tot = num('fTotal');
  if (ex === null && tax === null && tot === null) {
    toast('Please enter at least one amount'); return;
  }
  // When two of the three are given, fill in the missing one.
  if (tot === null && ex !== null && tax !== null) tot = Math.round((ex + tax) * 100) / 100;
  else if (ex === null && tot !== null && tax !== null) ex = Math.round((tot - tax) * 100) / 100;
  else if (tax === null && tot !== null && ex !== null) tax = Math.round((tot - ex) * 100) / 100;
  var desc = $('fDesc').value.trim() || 'Receipt';
  var date = $('fDate').value || todayISO();

  var row = [date, desc,
             ex === null ? '' : ex,
             tax === null ? '' : tax,
             tot === null ? '' : tot,
             state.photoName];
  var btn = $('btnSave');
  btn.disabled = true;

  var photoStep = ensureDirPermission().then(function () {
    return (!IS_ANDROID && state.photoBlob)
      ? savePhotoWeb(state.year, state.photoBlob, state.photoName)
      : true;
  });

  photoStep.then(function () {
    return appendRow(state.year, row);
  }).then(function () {
    btn.disabled = false;
    var loc = IS_ANDROID
      ? 'Documents › Receipts › ' + state.year
      : (chosenDir ? chosenDir.name + ' › ' + state.year : 'the ' + state.year + ' folder');
    toast('Saved to ' + loc);
    var photoCopy = state.photoBlob, photoNameCopy = state.photoName;
    cleanupPhotoUrl();
    if (!IS_ANDROID && !hasFileStorage()) offerWebDownloads(photoCopy, photoNameCopy);
    showHome();
  }).catch(function (e) {
    btn.disabled = false;
    toast('Save failed: ' + (e && e.message ? e.message : 'unknown error'));
  });
}

function discardCurrent() {
  deleteCapturedPhoto();
  cleanupPhotoUrl();
  toast('Discarded');
  showHome();
}

function cleanupPhotoUrl() {
  if (state.photoUrl && state.photoUrl.indexOf('blob:') === 0) {
    try { URL.revokeObjectURL(state.photoUrl); } catch (e) {}
  }
  state.photoUrl = null; state.photoId = null; state.photoBlob = null;
}

/* ================= Web-mode export ================= */
function downloadBlob(blob, name) {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () {
    URL.revokeObjectURL(a.href); a.remove();
  }, 4000);
}

function offerWebDownloads(photoBlob, photoName) {
  // No file storage available: hand the user the cumulative spreadsheet plus
  // the receipt photo, so nothing is lost.
  loadRows(state.year).then(function (rows) {
    downloadBlob(new Blob([buildXlsx(rows)], {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    }), xlsxName(state.year));
    if (photoBlob) downloadBlob(photoBlob, photoName || 'receipt.jpg');
  });
}

/* "Open spreadsheet": hands the up-to-date Excel file to the phone —
   pick Excel / Sheets in the menu to open it, or it saves to Downloads. */
function openSpreadsheet() {
  loadRows(state.year).then(function (rows) {
    var f = new File([buildXlsx(rows)], xlsxName(state.year), {
      type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
    });
    var can = false;
    try { can = !!(navigator.canShare && navigator.canShare({ files: [f] })); } catch (e) {}
    if (can) {
      navigator.share({ files: [f] }).catch(function (err) {
        // User closing the share sheet is fine; anything else → download instead.
        if (!err || err.name !== 'AbortError') {
          downloadBlob(f, f.name);
          toast('Saved to your Downloads');
        }
      });
    } else {
      downloadBlob(f, f.name);
      toast('Saved to your Downloads');
    }
  }).catch(function (e) {
    toast('Could not open the spreadsheet: ' + (e && e.message ? e.message : 'error'));
  });
}

/* ================= Photo gallery ================= */
var photoUrls = [];

function listPhotoFiles(year) {
  return yearSourceDir(year).then(function (dir) {
    var out = [], it = dir.values();
    function next() {
      return it.next().then(function (r) {
        if (r.done) return out;
        var h = r.value;
        if (h.kind === 'file' && /\.(jpe?g|png|webp)$/i.test(h.name)) {
          return h.getFile().then(function (f) { out.push(f); return next(); });
        }
        return next();
      });
    }
    return next();
  }).catch(function () { return []; });
}

function showPhotos() {
  $('viewHome').classList.add('hidden');
  $('viewPhotos').classList.remove('hidden');
  $('photosTitle').textContent = 'Receipt photos — ' + state.year;
  var grid = $('photoGrid');
  grid.innerHTML = '<div class="empty">Loading&hellip;</div>';
  listPhotoFiles(state.year).then(function (files) {
    files.sort(function (a, b) { return a.name < b.name ? 1 : -1; });
    photoUrls.forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) {} });
    photoUrls = [];
    grid.innerHTML = '';
    if (!files.length) {
      grid.innerHTML = '<div class="empty">No photos yet for ' + state.year + '.</div>';
      $('photosHint').textContent = '';
      return;
    }
    files.forEach(function (f) {
      var url = URL.createObjectURL(f);
      photoUrls.push(url);
      var img = document.createElement('img');
      img.src = url; img.alt = f.name; img.loading = 'lazy';
      img.addEventListener('click', function () { openPhotoOverlay(url, f.name); });
      grid.appendChild(img);
    });
    $('photosHint').textContent = chosenDir
      ? 'These photos live in the “' + chosenDir.name + ' › ' + state.year +
        '” folder on this device — you can also browse them with your Files app.'
      : 'These photos live in this app’s storage.';
  });
}

function closePhotos() {
  $('viewPhotos').classList.add('hidden');
  $('viewHome').classList.remove('hidden');
}

function openPhotoOverlay(url, name) {
  var ov = document.createElement('div');
  ov.id = 'photoOverlay';
  var img = document.createElement('img');
  img.src = url; img.alt = name;
  var x = document.createElement('button');
  x.className = 'closex'; x.innerHTML = '&#10005;';
  function close() { try { document.body.removeChild(ov); } catch (e) {} }
  ov.addEventListener('click', close);
  ov.appendChild(img); ov.appendChild(x);
  document.body.appendChild(ov);
}

/* ================= Init ================= */
function initYearSelect() {
  var sel = $('year'), now = new Date().getFullYear();
  for (var y = now + 1; y >= now - 7; y--) {
    var o = document.createElement('option');
    o.value = String(y); o.textContent = String(y);
    if (y === now) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener('change', function () {
    state.year = sel.value;
    refreshEntries();
  });
}

function init() {
  initYearSelect();
  $('btnScan').addEventListener('click', startScan);
  $('btnSave').addEventListener('click', saveCurrent);
  $('btnDiscard').addEventListener('click', discardCurrent);
  $('btnOpenSheet').addEventListener('click', openSpreadsheet);
  $('btnPhotos').addEventListener('click', showPhotos);
  $('btnPhotosBack').addEventListener('click', closePhotos);

  // Re-sync whenever the app comes back to the foreground, so the list always
  // matches the spreadsheet even if it was edited elsewhere.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !state.busy &&
        $('viewHome') && !$('viewHome').classList.contains('hidden')) {
      refreshEntries();
    }
  });

  $('btnChooseDir').addEventListener('click', chooseDir);
  $('btnForgetDir').addEventListener('click', forgetDir);
  $('btnReconnect').addEventListener('click', reconnectDir);

  if (!IS_ANDROID) {
    if (opfsOk && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
    // Register the offline service worker when hosted (not on file://).
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  }

  // Restore a previously chosen folder, then draw.
  var restore = dirSupport ? idbGet('dir') : Promise.resolve(null);
  restore.then(function (h) {
    if (!h || typeof h.queryPermission !== 'function') return;
    return h.queryPermission({ mode: 'readwrite' }).then(function (p) {
      if (p === 'granted') {
        chosenDir = h;
        flushPendingSync(state.year); // push anything saved while disconnected
      } else if (p === 'prompt') {
        pendingDirHandle = h;
      }
    }).catch(function () {});
  }).then(function () {
    refreshStorageUI();
    refreshEntries();
  });
}

function refreshStorageUI() {
  if (IS_ANDROID) {
    $('storageHint').innerHTML =
      'Each receipt photo and a running spreadsheet are saved on your phone in ' +
      '<b>Documents &#8250; Receipts &#8250; (tax year)</b>. Open them any time with your Files app.';
    return;
  }
  $('webExportRow').classList.remove('hidden');
  $('reconnectRow').classList.toggle('hidden', !pendingDirHandle);
  $('folderRow').classList.toggle('hidden', !dirSupport);
  $('btnForgetDir').classList.toggle('hidden', !chosenDir);

  if (pendingDirHandle) {
    $('storageHint').innerHTML =
      'Your receipts folder needs to be reconnected — tap the button above and allow access.';
  } else if (chosenDir) {
    $('storageHint').innerHTML =
      'Saving to the <b>' + esc(chosenDir.name) + '</b> folder on this device — ' +
      'a subfolder is created for each tax year with the photos and spreadsheet together. ' +
      'If Chrome asks about folder access again, choose <b>“Allow on every visit”</b> ' +
      'and it will stop asking.';
  } else if (dirSupport) {
    $('storageHint').innerHTML =
      'Receipts are currently kept in this app’s private storage. ' +
      'Tap <b>Choose folder&hellip;</b> to save them straight into a folder of your choice instead.';
  } else if (opfsOk) {
    $('storageHint').innerHTML =
      'Receipts are stored inside this app’s private storage, one folder per tax year. ' +
      '(This browser doesn’t allow direct folder access.)';
  } else {
    $('storageHint').innerHTML =
      'This browser can’t write files directly. Your receipt records are kept safely in ' +
      'the app’s own database, and after each save the <b>complete, up-to-date spreadsheet</b> ' +
      'and the photo are downloaded for your Files app.';
  }
  if (location.protocol === 'file:') {
    $('storageHint').innerHTML =
      '<b>Heads up:</b> you’ve opened the app as a local file. Open it from your hosted ' +
      'web link instead to get folder saving, the home-screen icon, and offline support.<br><br>' +
      $('storageHint').innerHTML;
  }
}

function chooseDir() {
  if (!dirSupport) return;
  window.showDirectoryPicker({ mode: 'readwrite', startIn: 'documents' })
    .then(function (h) {
      chosenDir = h;
      pendingDirHandle = null;
      return idbSet('dir', h).catch(function () {});
    })
    .then(function () {
      if (!chosenDir) return;
      toast('Receipts will be saved to “' + chosenDir.name + '”');
      refreshStorageUI();
      refreshEntries();
    })
    .catch(function () { /* user cancelled */ });
}

function forgetDir() {
  chosenDir = null;
  pendingDirHandle = null;
  idbDel('dir');
  toast('Using private app storage');
  refreshStorageUI();
  refreshEntries();
}

function reconnectDir() {
  if (!pendingDirHandle) return;
  pendingDirHandle.requestPermission({ mode: 'readwrite' }).then(function (p) {
    if (p === 'granted') {
      chosenDir = pendingDirHandle;
      pendingDirHandle = null;
      toast('Folder reconnected');
    } else {
      toast('Folder access was not allowed');
    }
    refreshStorageUI();
    refreshEntries();
  }).catch(function () { toast('Folder access was not allowed'); });
}

init();
</script>
